<!doctype html><html><head><meta charset="utf-8"><title>Collection Clients</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="sidebar"><div class="brand-logo"><img src="{{ url_for('static', filename='logo.png') }}"></div><a href="{{ url_for('collection_dashboard') }}">Dashboard</a><a href="{{ url_for('collection_accounts') }}">Accounts</a><a href="{{ url_for('collection_clients') }}">Clients</a><a href="{{ url_for('dashboard') }}">EMS Dashboard</a></div><div class="main"><h1>Clients / Creditors</h1><div class="card"><form method="post"><input name="name" placeholder="Client name" required><input name="contact_person" placeholder="Contact person"><input name="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="commission_rate" type="number" step="0.01" placeholder="Commission %"><textarea name="notes" placeholder="Notes"></textarea><button class="btn primary">Add Client</button></form></div><div class="card"><table><tr><th>Client</th><th>Contact</th><th>Commission</th><th>Status</th></tr>{% for c in clients %}<tr><td>{{ c.name }}</td><td>{{ c.contact_person or '—' }}</td><td>{{ c.commission_rate or 0 }}%</td><td>{{ c.status }}</td></tr>{% else %}<tr><td colspan="4">No clients yet.</td></tr>{% endfor %}</table></div></div></body></html>
